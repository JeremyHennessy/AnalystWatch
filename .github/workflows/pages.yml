name: Monitor and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: analystwatch-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout monitoring state
        uses: actions/checkout@v4
        with:
          ref: monitor-state
          path: .monitor-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AnalystWatch
        run: python -m pip install -e .

      - name: Sync source definitions
        run: |
          mkdir -p .monitor-state/runtime
          analystwatch --db .monitor-state/runtime/analystwatch.db sync-sources config/sources.json

      - name: Run monitoring
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            analystwatch --db .monitor-state/runtime/analystwatch.db check-due
          else
            analystwatch --db .monitor-state/runtime/analystwatch.db check-all
          fi

      - name: Build static dashboard
        run: analystwatch --db .monitor-state/runtime/analystwatch.db build-pages --output site

      - name: Persist monitoring state
        working-directory: .monitor-state
        shell: bash
        run: |
          git config user.name "analystwatch-bot"
          git config user.email "analystwatch-bot@users.noreply.github.com"
          git add -- runtime/analystwatch.db
          if git diff --cached --quiet; then
            echo "No monitoring state change to persist."
          else
            git commit -m "Update AnalystWatch monitoring state"
            git push origin HEAD:monitor-state
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: monitor-build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
